/* Layout: app header with mode tabs → filter bar → one working panel (list / card / quiz / progress). Rank is the spine: S A B C bands colour-coded. */

  --accent:#0089a3; --accent-ink:#ffffff; --star:#c99a00;
  --good:#1f8a5b; --bad:#c2410c;

  --display:"Zen Kaku Gothic New","IBM Plex Sans JP","Hiragino Sans",sans-serif;

}

:root[data-theme="dark"]{

  --rS:#efcd42; --rA:#35c9e4; --rB:#97a3ff; --rC:#9aa8b4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.brand small{display:block;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500;text-transform:uppercase}
h1{font-family:var(--display);font-size:clamp(24px,4.4vw,34px);line-height:1.2;margin:2px 0 0;text-wrap:balance}
h1 b{font-family:var(--mono);color:var(--accent);font-weight:600}
.headstat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.headstat strong{color:var(--fg);font-size:18px;font-family:var(--mono)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-bottom:14px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:16px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 200px;min-width:0;font-size:16px}
.rk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bg)}
.rk.S{background:var(--rS)}.rk.A{background:var(--rA)}.rk.B{background:var(--rB)}.rk.C{background:var(--rC)}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px;white-space:nowrap;font-weight:500}
.abbr{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--line);padding:0 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
/* list */
.listmeta{font-size:13px;color:var(--muted);margin-bottom:6px}
ul.words{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.words li{display:grid;grid-template-columns:44px 26px minmax(0,1.1fr) minmax(0,1fr) 30px;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
ul.words .en{font-weight:700}
ul.words .ja{min-width:0}
ul.words .note{grid-column:3/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
.known-dot{justify-self:end;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.known-dot[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.more{display:block;margin:16px auto 0;font:inherit;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
@media (max-width:600px){ul.words li{grid-template-columns:38px 24px minmax(0,1fr) 30px}ul.words .ja{grid-column:3/4}ul.words .known-dot{grid-row:1;grid-column:4}ul.words .note{grid-column:3/-1}}
/* card */
.cardzone{display:grid;gap:14px;justify-items:center}
.progressline{width:100%;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{width:100%;max-width:560px;min-height:280px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;align-content:center;justify-items:center;gap:10px;text-align:center;cursor:pointer;position:relative}
.card .meta{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.card .front{font-size:clamp(26px,6vw,38px);font-weight:700;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.card .sub{font-family:var(--mono);color:var(--accent);font-size:15px}
.card .back{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.card .back .ans{font-size:22px;font-weight:700}
.card .back .note{font-size:13.5px;color:var(--muted)}
.card .hint{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:500;padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;min-width:120px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.opts{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center}
/* quiz */
.qbox{max-width:600px;margin:0 auto;display:grid;gap:14px}
.qprompt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;display:grid;gap:6px}
.qprompt .w{font-size:clamp(22px,5vw,30px);font-weight:700;overflow-wrap:anywhere}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:baseline}
.choice .k{font-family:var(--mono);color:var(--muted);font-size:13px}
.choice.correct{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.choice.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.choice:disabled{cursor:default}
.feedback{font-size:14px;min-height:1.6em;text-align:center}
.exbox{display:grid;gap:4px;text-align:left;background:var(--sunk);border-radius:10px;padding:12px 14px;width:100%}
.exbox .exl{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.exbox .exen{font-size:15px;line-height:1.55}
.exbox .exen mark{background:transparent;color:var(--accent);font-weight:700}
.exbox .exja{font-size:13px;color:var(--muted)}
.refs{display:grid;gap:6px;text-align:left;width:100%}
.refs a{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.refs a:hover{border-color:var(--accent)}
.refs a .lang{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);flex:none}
.refs a .t{min-width:0;overflow-wrap:anywhere}
.qextra{display:grid;gap:10px}
.feedback.ok{color:var(--good)}.feedback.ng{color:var(--bad)}
.result{text-align:center;display:grid;gap:12px}
.result .score{font-family:var(--mono);font-size:44px;font-weight:600}
.misses{text-align:left;border-top:1px solid var(--line)}
.misses div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
/* test */
.tsetup{display:grid;gap:14px;max-width:640px;margin:0 auto}
.tsizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tsize{font:inherit;display:grid;gap:4px;justify-items:center;padding:18px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tsize:hover:not(:disabled){border-color:var(--accent)}
.tsize:disabled{opacity:.45;cursor:not-allowed}
.tsize .n{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.tsize .l{font-size:13px;color:var(--muted)}
.tsize .best{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.tnote{font-size:13px;color:var(--muted);text-align:center}
.tbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cert{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:26px 22px;display:grid;gap:10px;justify-items:center;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%);pointer-events:none}
.cert .tl{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.cert .title{font-family:var(--display);font-size:clamp(24px,5vw,32px);line-height:1.25;text-wrap:balance}
.cert .title small{display:block;font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.06em;margin-top:4px}
.cert .pct{font-family:var(--mono);font-size:48px;font-weight:600;line-height:1}
.cert .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cert .desc{font-size:14px;max-width:44ch}
.ladder{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.ladder span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ladder span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.share{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.share a,.share button{font:inherit;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.share .x{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.share .fb{background:#1877f2;color:#fff;border-color:#1877f2}
.share .line{background:#06c755;color:#fff;border-color:#06c755}
.sharetext{width:100%;font:inherit;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--fg);resize:vertical;min-height:84px}
.copied{font-size:12px;color:var(--good);min-height:1em;text-align:center}
@media (max-width:480px){.tsizes{grid-template-columns:1fr}}
/* progress */
.bands{display:grid;gap:12px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.band .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.band .lbl{display:flex;gap:10px;align-items:center;font-weight:700}
.band .lbl span.d{font-weight:400;color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.catgrid div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:6px}
.catgrid .row{display:flex;justify-content:space-between}
h2.sec{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin:26px 0 8px}
.reset{margin-top:20px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reset button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:8px;padding:5px 12px;cursor:pointer}
.empty{padding:28px 0;color:var(--muted);text-align:center}
footer{margin-top:40px;font-size:12px;color:var(--muted);line-height:1.7}

@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:active{transform:scale(.99)}}
</style>

at":"輸送","rank":1000,"ex":"Range safety officers can end the flight if necessary.","exja":"射場安全担当者は必要に応じて飛行を中断できる。","pos":"名詞","lja":["宙畑カテゴリ：輸送","https://sorabatake.jp/topics/transport/"],"len":["Sorabatake (EN): Launch & Transportation","https://sorabatake.jp/en/topics/transport/"]}];
const BANDS = [["S",1,200,"最初に覚えたい"],["A",201,500,"頻出"],["B",501,800,"実務で使う"],["C",801,1000,"専門"]];
const band = r => r<=200?"S":r<=500?"A":r<=800?"B":"C";
const CATS = [...new Set(W.map(w=>w.cat))];
const POS = ["名詞","固有名詞","動詞","形容詞","副詞","句・表現","略語"];
const posTag = w => `<span class="pos">${esc(w.pos)}</span>`;
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hlEx(w){
  let t=esc(w.ex||""); const cands=[w.en.replace(/\s*\(.*?\)/g,""), w.abbr].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const c of cands){ const re=new RegExp("("+c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i"); if(re.test(t)){ return t.replace(re,"<mark>$1</mark>"); } }
  for(const c of cands){ const ws=c.split(/\s+/).filter(Boolean); if(!ws.length) continue;
    const pat=ws.map(x=>x.replace(/[^A-Za-z0-9-]/g,"").slice(0,Math.max(3,x.length-2))+"[\\w-]*").join("\\s+");
    const re=new RegExp("\\b("+pat+")","i"); if(re.test(t)) return t.replace(re,"<mark>$1</mark>"); }
  return t;
}
function exHtml(w){ return w.ex?`<div class="exbox"><span class="exl">Example</span><span class="exen">${hlEx(w)}</span><span class="exja">${esc(w.exja||"")}</span></div>`:""; }
function refsHtml(w){
  const r=[]; if(w.lja) r.push(`<a href="${esc(w.lja[1])}" target="_blank" rel="noopener"><span class="lang">JA</span><span class="t">${esc(w.lja[0])}</span></a>`);
  if(w.len) r.push(`<a href="${esc(w.len[1])}" target="_blank" rel="noopener"><span class="lang">EN</span><span class="t">${esc(w.len[0])}</span></a>`);
  return r.length?`<div class="refs">${r.join("")}</div>`:"";
}
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let S = {known:{}, wrong:{}, mode:"list", rank:"all", cat:"all", dir:"en", order:"rank"};
try{ Object.assign(S, JSON.parse(localStorage.getItem("svocab")||"{}")); }catch(e){}
if(!["list","card","quiz","test","progress"].includes(S.mode)) S.mode="list";
S.pos = S.pos || "all";
const save = () => { try{ localStorage.setItem("svocab", JSON.stringify(S)); }catch(e){} };



function pool(){
  const t = $("q").value.trim().toLowerCase();
  return W.filter(w => (S.rank==="all"||band(w.rank)===S.rank) && (S.cat==="all"||w.cat===S.cat) &&
    (S.pos==="all"||(S.pos==="略語"?!!w.abbr:w.pos===S.pos)) &&
    (!t || [w.en,w.abbr,w.ja,w.note].some(v=>v&&v.toLowerCase().includes(t))));
}
function knownCount(list){ return list.filter(w=>S.known[w.rank]).length; }
function updateHead(){ $("hsKnown").textContent = Object.keys(S.known).length; }

/* filters */
function renderFilters(){
  $("rankSeg").innerHTML = [["all","全ランク"],...BANDS.map(b=>[b[0],b[0]+"ランク"])].map(([k,l])=>
    `<button type="button" data-r="${k}" aria-pressed="${S.rank===k}">${l}</button>`).join("");
  $("catSel").innerHTML = `<option value="all">すべての分野</option>` + CATS.map(c=>`<option ${S.cat===c?"selected":""}>${c}</option>`).join("");
  $("posSel").innerHTML = `<option value="all">すべての品詞</option>` + POS.map(c=>`<option value="${c}" ${S.pos===c?"selected":""}>${c==="略語"?"略語のある語":c}</option>`).join("");
  $("filters").hidden = S.mode==="progress";
}
$("rankSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.rank=b.dataset.r; save(); renderFilters(); render(true); });
$("catSel").addEventListener("change", e=>{ S.cat=e.target.value; save(); render(true); });
$("posSel").addEventListener("change", e=>{ S.pos=e.target.value; save(); render(true); });
$("q").addEventListener("input", ()=>render(true));

/* tabs */
document.querySelector("nav.tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; S.mode=b.dataset.mode; save(); renderTabs(); renderFilters(); render(true); });
function renderTabs(){ document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.mode===S.mode))); }

/* list */
let shown = 100;
function renderList(reset){
  if(reset) shown = 100;
  const p = pool();
  if(!p.length){ $("view").innerHTML = `<p class="empty">条件に合う単語がありません。ランクや分野の絞り込みを外すか、別の綴りで検索してください。</p>`; return; }
  $("view").innerHTML = `<div class="listmeta">${p.length}語（うち覚えた ${knownCount(p)}語）・右端の ✓ で「覚えた」に切り替え</div><ul class="words">` +
    p.slice(0,shown).map(w=>`<li>
      <span class="num">#${w.rank}</span><span class="rk ${band(w.rank)}">${band(w.rank)}</span>
      <span class="en">${esc(w.en)}${posTag(w)}${w.abbr?`<span class="abbr">${esc(w.abbr)}</span>`:""}</span>
      <span class="ja">${esc(w.ja)}</span>
      <button class="known-dot" type="button" data-k="${w.rank}" aria-pressed="${!!S.known[w.rank]}" aria-label="${esc(w.en)} を覚えた">✓</button>
      ${w.note?`<span class="note">${esc(w.note)}</span>`:""}</li>`).join("") + `</ul>` +
    (p.length>shown?`<button class="more" id="more" type="button">続きを表示（残り ${p.length-shown}語）</button>`:"");
  const m=$("more"); if(m) m.onclick=()=>{shown+=200; renderList(false);};
}
$("view").addEventListener("click", e=>{
  const k=e.target.closest(".known-dot"); if(!k) return;
  const r=k.dataset.k; if(S.known[r]) delete S.known[r]; else S.known[r]=1;
  k.setAttribute("aria-pressed", String(!!S.known[r])); save(); updateHead();
});

/* cards */
let deck=[], di=0, flipped=false;
function buildDeck(){
  let p = pool();
  if(S.order==="weak") p = p.filter(w=>!S.known[w.rank]).sort((a,b)=>(S.wrong[b.rank]||0)-(S.wrong[a.rank]||0)||a.rank-b.rank);
  else if(S.order==="shuffle") p = shuffle(p.filter(w=>!S.known[w.rank]));
  else p = p.filter(w=>!S.known[w.rank]);
  deck=p; di=0; flipped=false;
}
function renderCard(reset){
  if(reset) buildDeck();
  const opts = `<div class="opts">
    <label>表に出す <select id="dirSel"><option value="en" ${S.dir==="en"?"selected":""}>英語</option><option value="ja" ${S.dir==="ja"?"selected":""}>日本語</option></select></label>
    <label>順番 <select id="ordSel"><option value="rank" ${S.order==="rank"?"selected":""}>ランク順</option><option value="shuffle" ${S.order==="shuffle"?"selected":""}>シャッフル</option><option value="weak" ${S.order==="weak"?"selected":""}>間違えた順</option></select></label></div>`;
  if(!deck.length || di>=deck.length){
    $("view").innerHTML = `<div class="cardzone">${opts}<p class="empty">${deck.length?"この範囲のカードを一周しました。":"この範囲の単語はすべて「覚えた」になっています。"}<br>ランクや分野を変えるか、進み具合タブで記録を見直せます。</p><button class="btn primary" id="again" type="button">もう一周する</button></div>`;
    bindCardOpts(); $("again").onclick=()=>renderCard(true); return;
  }
  const w = deck[di], front = S.dir==="en" ? w.en : w.ja, back = S.dir==="en" ? w.ja : w.en;
  $("view").innerHTML = `<div class="cardzone">${opts}
    <div class="progressline"><span>${di+1} / ${deck.length}枚</span><span>この範囲で覚えた ${knownCount(pool())}語</span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="カードをめくる">
      <div class="meta"><span><span class="rk ${band(w.rank)}">${band(w.rank)}</span> <span class="num">#${w.rank}・${esc(w.cat)}</span>${posTag(w)}</span></div>
      <div class="front">${esc(front)}</div>
      ${S.dir==="en"&&w.abbr?`<div class="sub">${esc(w.abbr)}</div>`:""}
      ${flipped?`<div class="back"><div class="ans">${esc(back)}</div>${S.dir==="ja"&&w.abbr?`<div class="sub">${esc(w.abbr)}</div>`:""}${w.note?`<div class="note">${esc(w.note)}</div>`:""}${exHtml(w)}${refsHtml(w)}</div>`:`<div class="hint">タップ（またはスペースキー）で答えを表示</div>`}
    </div>
    <div class="actions">${flipped?`<button class="btn bad" id="ng" type="button">まだ</button><button class="btn good" id="ok" type="button">覚えた</button>`:`<button class="btn primary" id="flip" type="button">答えを見る</button>`}</div></div>`;
  bindCardOpts();
  const flip=()=>{flipped=true; renderCard(false);};
  $("card").onclick=e=>{ if(e.target.closest("#spk")) return; if(!flipped) flip(); };
  $("card").onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault(); if(!flipped) flip();} };
  if($("flip")) $("flip").onclick=flip;
  if($("ok")) $("ok").onclick=()=>{ S.known[w.rank]=1; save(); updateHead(); di++; flipped=false; renderCard(false); };
  if($("ng")) $("ng").onclick=()=>{ S.wrong[w.rank]=(S.wrong[w.rank]||0)+1; save(); di++; flipped=false; renderCard(false); };
}
function bindCardOpts(){
  const d=$("dirSel"), o=$("ordSel");
  if(d) d.onchange=()=>{S.dir=d.value; save(); flipped=false; renderCard(false);};
  if(o) o.onchange=()=>{S.order=o.value; save(); renderCard(true);};
}

/* quiz */
let Q=null;
function newQuiz(){
  const p = pool();
  if(p.length<4){ Q=null; return; }
  const qs = shuffle(p).slice(0, Math.min(10,p.length)).map(w=>{
    const same = W.filter(x=>x.cat===w.cat && x.rank!==w.rank && x.ja!==w.ja);
    const others = W.filter(x=>x.cat!==w.cat && x.ja!==w.ja);
    const ds = shuffle(same).slice(0,3); while(ds.length<3) ds.push(shuffle(others)[0]);
    return {w, choices: shuffle([w,...ds])};
  });
  Q={qs, i:0, score:0, answered:false, misses:[]};
}
function renderQuiz(reset){
  if(reset||!Q) newQuiz();
  if(!Q){ $("view").innerHTML=`<p class="empty">クイズには4語以上が必要です。絞り込みを広げてください。</p>`; return; }
  if(Q.i>=Q.qs.length){
    const n=Q.qs.length;
    $("view").innerHTML=`<div class="qbox result"><div class="num">結果</div><div class="score">${Q.score} / ${n}</div>
      <div>${Q.score===n?"全問正解です。正解した単語は「覚えた」に入りました。":"間違えた単語は、カードの「間違えた順」で優先して出てきます。"}</div>
      ${Q.misses.length?`<div class="misses">${Q.misses.map(w=>`<div><span class="rk ${band(w.rank)}">${band(w.rank)}</span><strong>${esc(w.en)}</strong><span>${esc(w.ja)}</span></div>`).join("")}</div>`:""}
      <div class="actions"><button class="btn primary" id="retry" type="button">次の10問</button></div></div>`;
    $("retry").onclick=()=>renderQuiz(true); return;
  }
  const {w,choices}=Q.qs[Q.i], enQ = S.dir==="en";
  $("view").innerHTML=`<div class="qbox">
    <div class="opts"><label>出題 <select id="qdir"><option value="en" ${enQ?"selected":""}>英語 → 日本語</option><option value="ja" ${!enQ?"selected":""}>日本語 → 英語</option></select></label></div>
    <div class="progressline"><span>第${Q.i+1}問 / ${Q.qs.length}</span><span>正解 ${Q.score}</span></div>
    <div class="qprompt"><div><span class="rk ${band(w.rank)}">${band(w.rank)}</span> <span class="num">${esc(w.cat)}</span>${posTag(w)}</div>
      <div class="w">${esc(enQ?w.en:w.ja)}</div>${enQ&&w.abbr?`<div class="sub abbr" style="justify-self:center">${esc(w.abbr)}</div>`:""}
</div>
    <div class="choices">${choices.map((c,k)=>`<button class="choice" type="button" data-r="${c.rank}"><span class="k">${"ABCD"[k]}</span><span>${esc(enQ?c.ja:c.en)}</span></button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="qextra" id="qx" hidden></div>
    <div class="actions" id="nextWrap" hidden><button class="btn primary" id="next" type="button">${Q.i+1<Q.qs.length?"次の問題":"結果を見る"}</button></div></div>`;
  $("qdir").onchange=e=>{S.dir=e.target.value; save(); renderQuiz(false);};
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(Q.answered) return; Q.answered=true;
    const ok = +b.dataset.r===w.rank;
    document.querySelectorAll(".choice").forEach(x=>{ x.disabled=true; if(+x.dataset.r===w.rank) x.classList.add("correct"); });
    if(ok){ Q.score++; S.known[w.rank]=1; $("fb").className="feedback ok"; $("fb").textContent="正解"+(w.note?"　"+w.note:""); }
    else { b.classList.add("wrong"); S.wrong[w.rank]=(S.wrong[w.rank]||0)+1; delete S.known[w.rank]; Q.misses.push(w);
      $("fb").className="feedback ng"; $("fb").textContent=`正解は「${enQ?w.ja:w.en}」`+(w.note?"　"+w.note:""); }
    $("qx").innerHTML=exHtml(w)+refsHtml(w); $("qx").hidden=false;
    save(); updateHead(); $("nextWrap").hidden=false; $("next").focus();
  });
  $("next").onclick=()=>{ Q.i++; Q.answered=false; renderQuiz(false); };
}

/* progress */
let confirmReset=false;
function renderProgress(){
  const bandsHtml = BANDS.map(([k,a,b,d])=>{
    const list=W.filter(w=>w.rank>=a&&w.rank<=b), n=knownCount(list), pct=Math.round(n/list.length*100);
    return `<div class="band"><div class="row"><div class="lbl"><span class="rk ${k}">${k}</span>${k}ランク <span class="d">#${a}–${b}・${d}</span></div><div class="num"><strong style="color:var(--fg);font-size:15px">${n}</strong> / ${list.length}語（${pct}%）</div></div><div class="bar"><i style="width:${pct}%;background:var(--r${k})"></i></div></div>`;
  }).join("");
  const cats = CATS.map(c=>{ const l=W.filter(w=>w.cat===c), n=knownCount(l), pct=Math.round(n/l.length*100);
    return `<div><div class="row"><span>${c}</span><span class="num">${n}/${l.length}</span></div><div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div></div>`; }).join("");
  const weak = W.filter(w=>S.wrong[w.rank]&&!S.known[w.rank]).sort((a,b)=>S.wrong[b.rank]-S.wrong[a.rank]).slice(0,10);
  $("view").innerHTML = `<div class="bands">${bandsHtml}</div>
    <h2 class="sec">分野別</h2><div class="catgrid">${cats}</div>
    <h2 class="sec">よく間違える単語</h2>
    ${weak.length?`<div class="misses">${weak.map(w=>`<div><span class="rk ${band(w.rank)}">${band(w.rank)}</span><strong>${esc(w.en)}</strong><span>${esc(w.ja)}</span><span class="num">×${S.wrong[w.rank]}</span></div>`).join("")}</div>`:`<p class="empty" style="text-align:left;padding:4px 0">まだ記録がありません。カードで「まだ」を押すか、クイズで間違えた単語がここに並びます。</p>`}
    <div class="reset">${confirmReset?`<span>学習の記録をすべて消します。よろしいですか？</span><button type="button" id="doReset">消去する</button><button type="button" id="cancelReset" style="color:var(--fg)">やめる</button>`:`<button type="button" id="askReset">学習の記録をリセット</button>`}</div>`;
  if($("askReset")) $("askReset").onclick=()=>{confirmReset=true; renderProgress();};
  if($("cancelReset")) $("cancelReset").onclick=()=>{confirmReset=false; renderProgress();};
  if($("doReset")) $("doReset").onclick=()=>{ S.known={}; S.wrong={}; save(); updateHead(); confirmReset=false; renderProgress(); };
}

/* test */
// 公開URL：GitHub Pages では、このページ自身のURL（index.html を除いたもの）を自動で使う。
// 独自ドメインなどで固定したい場合は SITE_URL に書く（例 "https://example.github.io/space-vocab/"）。
const SITE_URL = "";
const PAGE_URL = (location.origin + location.pathname).replace(/index\.html$/, "");
const SHARE_URL = SITE_URL || PAGE_URL;
const IS_PUBLIC = !!SITE_URL || (/^https?:$/.test(location.protocol) && !/(claude|anthropic|usercontent|localhost|127\.0\.0\.1)/.test(location.hostname));
const TITLES = [
  [100,"宇宙ビジネス英語 ミッションコマンダー","MISSION COMMANDER","全問正解。英語の宇宙ニュースも契約書も、もう怖くありません。"],
  [90,"フライトディレクター","FLIGHT DIRECTOR","業界の英語をほぼ完璧に使いこなせるレベルです。"],
  [80,"宇宙飛行士","ASTRONAUT","英語の宇宙ニュースを辞書なしで読み進められる実力です。"],
  [65,"ミッションスペシャリスト","MISSION SPECIALIST","主要な用語はしっかり身についています。苦手分野を固めれば次の称号へ。"],
  [50,"フライトコントローラー","FLIGHT CONTROLLER","基礎は押さえています。カードで間違えた単語を復習しましょう。"],
  [30,"宇宙飛行士候補生","ASTRONAUT CANDIDATE","訓練はここから。Sランクの200語から覚えるのが近道です。"],
  [0,"カウントダウン中","COUNTDOWN","打ち上げ前の準備段階。まずはカードで単語に慣れましょう。"]
];
const titleFor = pct => TITLES.find(t=>pct>=t[0]);
S.best = S.best || {};
let T=null;
function startTest(n){
  const p = pool();
  const qs = shuffle(p).slice(0,n).map(w=>{
    const dir = Math.random()<.5 ? "en" : "ja";
    const same = W.filter(x=>x.cat===w.cat && x.rank!==w.rank && x.ja!==w.ja && x.en!==w.en);
    const ds = shuffle(same).slice(0,3); while(ds.length<3) ds.push(shuffle(W.filter(x=>x.rank!==w.rank && !ds.includes(x)))[0]);
    return {w, dir, choices: shuffle([w,...ds]), picked:null};
  });
  T={n, qs, i:0, score:0, t0:Date.now(), locked:false, done:false};
  renderTest();
}
function renderTest(){
  if(!T||T.done){ return T&&T.done ? renderTestResult() : renderTestSetup(); }
  const q=T.qs[T.i], w=q.w, enQ=q.dir==="en";
  $("view").innerHTML=`<div class="qbox">
    <div class="progressline"><span>${T.n}問テスト　第${T.i+1}問 / ${T.n}</span><span>正解 ${T.score}</span></div>
    <div class="tbar"><i style="width:${(T.i)/T.n*100}%"></i></div>
    <div class="qprompt"><div class="num">${enQ?"英語 → 日本語":"日本語 → 英語"}・${esc(w.cat)}${posTag(w)}</div>
      <div class="w">${esc(enQ?w.en:w.ja)}</div>${enQ&&w.abbr?`<div class="sub abbr" style="justify-self:center">${esc(w.abbr)}</div>`:""}</div>
    <div class="choices">${q.choices.map((c,k)=>`<button class="choice" type="button" data-r="${c.rank}"><span class="k">${"ABCD"[k]}</span><span>${esc(enQ?c.ja:c.en)}</span></button>`).join("")}</div>
    <div class="actions"><button class="btn" id="tquit" type="button">テストをやめる</button></div></div>`;
  $("tquit").onclick=()=>{ T=null; renderTestSetup(); };
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(T.locked) return; T.locked=true;
    const ok=+b.dataset.r===w.rank; q.picked=+b.dataset.r;
    document.querySelectorAll(".choice").forEach(x=>{ x.disabled=true; if(+x.dataset.r===w.rank) x.classList.add("correct"); });
    if(ok){ T.score++; S.known[w.rank]=1; } else { b.classList.add("wrong"); S.wrong[w.rank]=(S.wrong[w.rank]||0)+1; delete S.known[w.rank]; }
    save(); updateHead();
    setTimeout(()=>{ T.locked=false; T.i++; if(T.i>=T.n){ T.done=true; T.secs=Math.round((Date.now()-T.t0)/1000); const pct=Math.round(T.score/T.n*100); if(!S.best[T.n]||pct>S.best[T.n]) S.best[T.n]=pct; save(); } renderTest(); }, ok?550:1100);
  });
}
function renderTestSetup(){
  const p=pool(), scope=(S.rank==="all"?"全ランク":S.rank+"ランク")+(S.cat==="all"?"":"・"+S.cat)+(S.pos==="all"?"":"・"+(S.pos==="略語"?"略語のある語":S.pos));
  $("view").innerHTML=`<div class="tsetup">
    <p class="tnote">出題範囲：${esc(scope)}（${p.length}語）。上の絞り込みで範囲を変えられます。英→日と日→英がランダムに出題され、結果に応じて称号が決まります。</p>
    <div class="tsizes">${[10,50,100].map(n=>`<button class="tsize" type="button" data-n="${n}" ${p.length<n?"disabled":""}><span class="n">${n}</span><span class="l">問テスト${n===10?"（約2分）":n===50?"（約8分）":"（約15分）"}</span><span class="best">${S.best[n]!=null?`最高 ${S.best[n]}%・${titleFor(S.best[n])[1]}`:"未挑戦"}</span></button>`).join("")}</div>
    ${p.length<100?`<p class="tnote">${p.length<10?"この範囲は10語未満のため、テストを始められません。":"この範囲の単語数では一部のテストを選べません。"}絞り込みを広げてください。</p>`:""}
    <h2 class="sec" style="text-align:center">称号</h2>
    <div class="ladder">${TITLES.slice().reverse().map(t=>`<span>${t[0]}%〜 ${esc(t[1])}</span>`).join("")}</div></div>`;
  document.querySelectorAll(".tsize").forEach(b=>b.onclick=()=>startTest(+b.dataset.n));
}
function shareText(){
  const pct=Math.round(T.score/T.n*100), t=titleFor(pct);
  return `宇宙ビジネス英単語1000の${T.n}問テストで${T.score}/${T.n}問正解（正答率${pct}%）、称号「${t[1]}」を獲得しました！ #宙畑 #宇宙ビジネス英単語`;
}
function renderTestResult(){
  const pct=Math.round(T.score/T.n*100), t=titleFor(pct), txt=shareText();
  const misses=T.qs.filter(q=>q.picked!==q.w.rank);
  const mm=Math.floor(T.secs/60), ss=T.secs%60;
  $("view").innerHTML=`<div class="qbox">
    <div class="cert"><span class="tl">${T.n}問テスト 結果</span>
      <div class="pct">${pct}%</div><div class="meta">${T.score} / ${T.n}問正解・${mm}分${String(ss).padStart(2,"0")}秒</div>
      <div class="title">${esc(t[1])}<small>${t[2]}</small></div>
      <div class="desc">${esc(t[3])}</div>
      <div class="ladder">${TITLES.slice().reverse().map(x=>`<span class="${x===t?"on":""}">${esc(x[1])}</span>`).join("")}</div></div>
    <h2 class="sec" style="text-align:center;margin:6px 0 0">結果をシェアする</h2>
    <div class="share">
      <a class="x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(SHARE_URL)}" target="_blank" rel="noopener">Xでポスト</a>
      <a class="fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SHARE_URL)}" target="_blank" rel="noopener">Facebookでシェア</a>
      <a class="line" href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">LINEで送る</a>
      <button type="button" id="copyBtn">文面をコピー</button></div>
    <textarea class="sharetext" id="shareTxt" readonly aria-label="シェア用の文面">${esc(txt+" "+SHARE_URL)}</textarea>
    <div class="copied" id="copied" aria-live="polite"></div>
    <p class="tnote">Facebookは文面を自動で入れられないため、「文面をコピー」してから貼り付けてください。</p>${IS_PUBLIC?"":`<p class="tnote" style="color:var(--bad)">このページはまだGitHub Pagesで公開されていないため、シェアされるリンクは仮のものです。公開後はページのURLが自動で使われます。</p>`}
    <div class="actions"><button class="btn primary" id="tagain" type="button">もう一度${T.n}問テスト</button><button class="btn" id="tback" type="button">問題数を選び直す</button></div>
    ${misses.length?`<h2 class="sec">間違えた単語（${misses.length}語）　カードの「間違えた順」で復習できます</h2><div class="misses">${misses.map(q=>`<div><span class="rk ${band(q.w.rank)}">${band(q.w.rank)}</span><strong>${esc(q.w.en)}</strong><span>${esc(q.w.ja)}</span></div>`).join("")}</div>`:""}
  </div>`;
  $("copyBtn").onclick=async()=>{ const ta=$("shareTxt"); try{ await navigator.clipboard.writeText(ta.value); $("copied").textContent="コピーしました"; }catch(e){ ta.focus(); ta.select(); $("copied").textContent="文面を選択しました。長押しまたは Ctrl+C でコピーしてください"; } };
  $("tagain").onclick=()=>startTest(T.n);
  $("tback").onclick=()=>{ T=null; renderTestSetup(); };
}

function render(reset){
  if(S.mode==="test"){ if(reset&&T&&!T.done) T=null; return renderTest(); }
  if(S.mode==="list") renderList(reset);
  else if(S.mode==="card") renderCard(reset);
  else if(S.mode==="quiz") renderQuiz(reset);
  else renderProgress();
}
renderTabs(); renderFilters(); updateHead(); render(true);
</script>
